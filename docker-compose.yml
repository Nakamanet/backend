services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    working_dir: /var/www/html
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Throwaway database for `make test` only — the app itself talks to Neon.
  # Port 5433 on purpose: never collides with a Postgres already on 5432.
  # Credentials are hardcoded and public by design; nothing here is sensitive.
  postgres_test:
    image: postgres:16-alpine
    container_name: laravel_postgres_test
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: testeur
      POSTGRES_USER: testeur
      POSTGRES_PASSWORD: testeur
    tmpfs:
      # Data lives in RAM: fast, and wiped on every container restart.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testeur -d testeur"]
      interval: 2s
      timeout: 3s
      retries: 20
